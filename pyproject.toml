[project]
name = "rag-local"
version = "0.1.0"
description = "RAG local em Python com Ollama e DuckDB, sem frameworks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
rag = "rag_local.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
